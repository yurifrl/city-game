name: Build and Deploy Image

# The home cluster schedules this pod on any Ready node, and its only
# schedulable amd64 node is memory-starved — so the image MUST run on the
# arm64 nodes too. Both GitHub-hosted arches are free on public repos and
# build natively (no QEMU): amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm.
# Each job pushes a per-arch digest; merge() folds them into one manifest.
#
# The deploy job then pins chart/values.yaml to the per-commit sha-<sha> tag
# via an auto-merged PR (same pattern as home-systems billing functions).
# ArgoCD auto-syncs the chart on every main push, so the bump changes the
# rendered pod spec and rolls the deployment onto the image built here.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Buildx
        # v3.11.1
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        # v3.4.0
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        # v5.8.0
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Per-arch pushes are addressable only by digest; tags are applied
          # once, on the merged multi-arch manifest (merge job).
          tags: type=sha,format=long

      - name: Build and push by digest
        id: build
        # v7.1.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Download digests
        # v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        # v3.11.1
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        # v3.4.0
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        # v5.8.0
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  deploy:
    name: Pin chart to the built image
    # Deploy happens through ArgoCD, which auto-syncs chart/ at HEAD on every
    # main push. Nothing restarts the pod on a same-manifest sync, so the
    # rollout is driven by pinning image.tag to the sha-<sha> tag the merge
    # job just pushed — the rendered pod spec changes, ArgoCD rolls it.
    runs-on: ubuntu-latest
    needs: [merge]
    # Only real merges to main deploy; tag pushes and manual dispatch rebuild
    # images without touching the chart.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    # Serialize bumps so a rapid second push rebases cleanly on the first.
    concurrency:
      group: deploy-city-game
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      # Check out main tip, not the built SHA: the bump PR must apply cleanly
      # on whatever chart state is current, while still naming the image
      # built from github.sha.
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main

      - name: Pin image.tag to sha-${{ github.sha }}
        id: pin
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          sed -i -E "s|^  tag: .*|  tag: ${tag}|; s|^  # :latest moves on every main-branch push.*|  # Pinned by CI to the image built from the deployed commit (sha-<git sha>).|" chart/values.yaml
          if git diff --quiet -- chart/values.yaml; then
            echo "Chart already pinned to ${tag}; nothing to deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open and merge image-tag bump PR
        if: steps.pin.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          branch="ci/pin-image-${GITHUB_SHA}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git commit -am "ci(deploy): pin image to ${tag} [skip ci]"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "ci(deploy): pin image to ${tag}" \
            --body "Automated content-addressed deploy bump (built from ${GITHUB_SHA}). ArgoCD syncs this and rolls the deployment."
          # --subject/--body pin the squash commit message so [skip ci] lands
          # in it regardless of repo merge settings; otherwise the bump commit
          # would retrigger this workflow and loop.
          gh pr merge "${branch}" --squash --delete-branch \
            --subject "ci(deploy): pin image to ${tag} [skip ci]" \
            --body "Built from ${GITHUB_SHA}. [skip ci]"
        env:
          GH_TOKEN: ${{ github.token }}

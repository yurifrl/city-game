version: "3"

vars:
  PORT: "8080"

tasks:
  install:
    desc: Install web and site dependencies
    cmds:
      - bun install --cwd apps/web
      - bun install --cwd apps/site

  server:
    desc: Build and run the authoritative server (127.0.0.1:{{.PORT}})
    deps: [dist]
    cmds:
      - cargo run -p city-server

  web:
    desc: Run the Vite dev server (proxies /api and /ws to the server)
    cmds:
      - bun run --cwd apps/web dev

  dist:
    desc: Build the web client into apps/web/dist
    cmds:
      - bun run --cwd apps/web build

  run:docs:
    desc: Run the docs site dev server (apps/site)
    cmds:
      - bun run --cwd apps/site dev

  run:
    desc: Start everything (web client build + server + Vite dev server)
    deps: [server, web]
    silent: true

  test:
    desc: Run workspace tests and type-check the web client
    cmds:
      - cargo test --workspace
      - bun run --cwd apps/web build

  clean:
    desc: Remove build output
    cmds:
      - cargo clean
      - rm -rf apps/web/dist
      - rm -rf apps/site/dist

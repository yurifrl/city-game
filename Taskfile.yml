version: "3"

vars:
  GAME_PORT: "8090"

tasks:
  run:
    desc: Build the viewer and server, start the server, and open the stream in the browser
    cmds:
      - bun install --cwd apps/viewer
      - bun run --cwd apps/viewer build
      - cargo build -p city-server
      - scripts/run-stream.sh {{.GAME_PORT}}

  test:
    desc: Rust workspace tests (need a GPU or software Vulkan adapter) and viewer tests
    cmds:
      - cargo test --workspace
      - bun install --cwd apps/viewer
      - bun test --cwd apps/viewer

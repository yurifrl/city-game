version: "3"

vars:
  GAME_PORT: "8090"
  STREAM_PORT: "8092"

tasks:
  run:
    desc: Build, start the game server + video bridge, and open the stream in the browser
    cmds:
      - bun install --cwd apps/web
      - bun install --cwd apps/stream
      - bun run --cwd apps/web build
      - cargo build -p city-server
      - scripts/run-stream.sh {{.GAME_PORT}} {{.STREAM_PORT}}

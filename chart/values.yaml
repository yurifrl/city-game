# ── city-game chart values ─────────────────────────────────────────────────
# One image, one container: city-server renders and streams the game and serves
# the viewer page, /api, /ws and /stream on one port. The browser only plays
# video and sends raw input.

image:
  repository: ghcr.io/yurifrl/city-game
  tag: sha-930aa4d4f708c41642355a54377c246e5e7ef062
  # Pinned by CI to the image built from the deployed commit (sha-<git sha>).
  pullPolicy: Always

# Hostnames for the Istio VirtualService. external-dns (istio-virtualservice
# source, domain filter syscd.live, proxied) turns the .live name into a proxied
# Cloudflare record behind Access. The gateway's tailscale annotation publishes
# syscd.tech hostnames to MagicDNS (*.syscd.tech -> 192.168.68.201), giving a
# tailnet route that is NOT behind Cloudflare Access.
hosts:
  - city-game.syscd.tech
  - city-game.syscd.live

# SQLite world state (./data/city.db via /app/data -> /data).
storage:
  className: longhorn-ha
  size: 1Gi

# Software rendering (lavapipe) of every seat runs inside this container, so it
# is CPU and memory heavy on purpose. Sizes are provisional: measure frame time
# per seat before tuning.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

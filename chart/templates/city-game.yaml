{{/*
One pod, one container. city-server owns the world, renders each viewer's
view on the CPU (Mesa lavapipe, the cluster has no GPU), streams JPEG frames
and serves the viewer page, /api, /ws and /stream on :8080.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: city-game
  labels:
    app: city-game
spec:
  replicas: 1
  # RWO SQLite volume: a rolling update on a different node deadlocks on the
  # volume detach (new pod waits for the old pod's PVC, old pod waits for the
  # new pod to become ready). Recreate takes the brief downtime instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: city-game
  template:
    metadata:
      labels:
        app: city-game
        istio.io/dataplane-mode: ambient
    spec:
      # CI publishes linux/amd64 + linux/arm64; any Ready cluster node fits.
      # The server runs as uid 65532 and creates ./data/city.db at startup;
      # fsGroup gives it group-write on the Longhorn volume's root dir.
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: server
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # No /healthz route exists in the server; "/" serves the viewer page,
          # so it doubles as a probe target. readinessFailureThreshold x period 10s
          # keeps a crashlooping pod out of the Service endpoints quickly,
          # instead of the default 3 failures x 30s liveness cadence.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: city-game
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: city-game
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: city-game
  labels:
    app: city-game
spec:
  selector:
    app: city-game
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: city-game
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  hosts:
    {{- toYaml .Values.hosts | nindent 4 }}
  gateways:
    - istio-system/dev
    - istio-system/cloudflare
    - istio-system/tailscale
  http:
    - route:
        - destination:
            host: city-game.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80

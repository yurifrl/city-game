{{/*
One pod, two serving modes, three front ends.

- The server container (default image mode) serves the static web build plus
  same-origin /api + /ws on :8080 — the direct client, reached via the
  city-game service (tailnet hosts).
- The stream container (MODE=stream) is the video bridge: warm headless
  Chromium seats render the game server-side; pixel-only viewers watch and
  play through the city-game-stream service (public .live host). It shares
  the pod's localhost with the server (CITY_GAME_URL=http://127.0.0.1:8080),
  so viewer traffic never leaves the node.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: city-game
  labels:
    app: city-game
spec:
  replicas: 1
  # RWO SQLite volume: a rolling update on a different node deadlocks on the
  # volume detach (new pod waits for the old pod's PVC, old pod waits for the
  # new pod to become ready). Recreate takes the brief downtime instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: city-game
  template:
    metadata:
      labels:
        app: city-game
        istio.io/dataplane-mode: ambient
    spec:
      # CI publishes linux/amd64 + linux/arm64; any Ready cluster node fits.
      # The server runs as uid 65532 and creates ./data/city.db at startup;
      # fsGroup gives it group-write on the Longhorn volume's root dir.
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: server
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # No /healthz route exists in the server; "/" serves the SPA, so it
          # doubles as a probe target. readinessFailureThreshold x period 10s
          # keeps a crashlooping pod out of the Service endpoints quickly,
          # instead of the default 3 failures x 30s liveness cadence.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: stream
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MODE
              value: stream
            # Same pod → the game server is reachable on loopback.
            - name: CITY_GAME_URL
              value: http://127.0.0.1:8080
            - name: CITY_SEATS
              value: {{ .Values.stream.seats | quote }}
            - name: CITY_STREAM_CHROME
              value: /usr/bin/chromium-browser
          ports:
            - name: stream
              containerPort: 8092
              protocol: TCP
          # /api/status.json exists once the service listens; a seat pool
          # still warming stays "ready" and the viewer redirects work — only
          # a dead bridge should drop out of the endpoints.
          livenessProbe:
            httpGet:
              path: /api/status.json
              port: stream
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/status.json
              port: stream
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 2
          resources:
            {{- toYaml .Values.stream.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: city-game
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: city-game
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: city-game
  labels:
    app: city-game
spec:
  selector:
    app: city-game
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: city-game-stream
  labels:
    app: city-game
spec:
  selector:
    app: city-game
  ports:
    - name: stream
      port: 80
      targetPort: stream
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: city-game
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  hosts:
    {{- toYaml .Values.hosts | nindent 4 }}
  gateways:
    - istio-system/dev
    - istio-system/cloudflare
    - istio-system/tailscale
  http:
    - route:
        - destination:
            host: city-game.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: city-game-live
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # The public host IS the streaming experience: everything funnels to the
  # video bridge. The direct client stays on the tailnet (city-game VS).
  hosts:
    {{- toYaml .Values.viewerHosts | nindent 4 }}
  gateways:
    - istio-system/dev
    - istio-system/cloudflare
    - istio-system/tailscale
  http:
    # Ordered matches; the last is the catch-all.
    - match:
        - uri:
            prefix: /view
      route:
        - destination:
            host: city-game-stream.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            prefix: /ws/
      route:
        - destination:
            host: city-game-stream.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: city-game-stream.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            prefix: /static/
      route:
        - destination:
            host: city-game-stream.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    # Root serves the viewer (bridge redirects to a live seat).
    - match:
        - uri:
            exact: /
      route:
        - destination:
            host: city-game-stream.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
      rewrite:
        uri: /view
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: city-game-stream.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
